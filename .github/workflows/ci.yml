name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Secrets.plist is gitignored and declared as a resource in Package.swift, so its
      # absence fails the build outright rather than just warning at runtime. No real
      # secrets are needed to compile or run the test suite, so seed placeholders.
      - name: Seed Secrets.plist from the example
        run: |
          SECRETS=Sources/NotifyGCalMenu/Resources/Secrets.plist
          if [ ! -f "$SECRETS" ]; then
            cp "$SECRETS.example" "$SECRETS"
          fi

      # build.sh, not `swift build`: it also assembles and codesigns the .app, embedding
      # Sparkle.framework with the correct rpath and nested signing order — the parts that
      # actually break are far more likely to be there than in compilation.
      - name: Build and assemble the app
        run: ./Scripts/build.sh

      - name: Test
        run: swift test
